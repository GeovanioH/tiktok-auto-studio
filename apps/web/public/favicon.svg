<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="fav-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="fav-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="fav-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="60%" stop-color="#C70039" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <linearGradient id="fav-facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <linearGradient id="fav-facet-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis Plate -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#fav-bg)" stroke="#334155" stroke-width="1.5" />
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="url(#fav-rim)" stroke-width="1.2" />

  <g filter="url(#fav-glow)">
    <!-- Arc 1: Rising Automation Loop (Cyan -> Azure) -->
    <path 
      d="M 28 66 C 18 52 20 32 36 22 C 48 14 62 16 70 24 L 62 31 C 56 25 46 24 38 29 C 27 36 26 50 34 60 C 40 68 50 70 60 67 L 62 76 C 50 80 37 77 28 66 Z" 
      fill="url(#fav-cyan)" 
    />

    <!-- Arc 2: Descending Studio Loop (Crimson -> Purple) -->
    <path 
      d="M 72 34 C 82 48 80 68 64 78 C 52 86 38 84 30 76 L 38 69 C 44 75 54 76 62 71 C 73 64 74 50 66 40 C 60 32 50 30 40 33 L 38 24 C 50 20 63 23 72 34 Z" 
      fill="url(#fav-magenta)" 
    />

    <!-- Center: 3D Faceted Quantum Play Prism -->
    <polygon points="43,35 65,50 43,50" fill="url(#fav-facet-top)" />
    <polygon points="43,50 65,50 43,65" fill="url(#fav-facet-bottom)" />
    <line x1="43" y1="35" x2="43" y2="65" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" />

    <!-- AI Starburst (Intelligence Catalyst) -->
    <path d="M 70 24 Q 70 30 76 30 Q 70 30 70 36 Q 70 30 64 30 Q 70 30 70 24 Z" fill="#00F5D4" />
    <circle cx="70" cy="30" r="1.2" fill="#FFFFFF" />

    <!-- Micro-sparkle anchor -->
    <path d="M 28 68 Q 28 72 32 72 Q 28 72 28 76 Q 28 72 24 72 Q 28 72 28 68 Z" fill="#FF5D8F" opacity="0.8" />
  </g>
</svg>
