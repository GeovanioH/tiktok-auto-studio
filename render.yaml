databases:
  - name: tiktok-studio-db
    databaseName: tiktok_studio
    user: tiktok_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: tiktok-auto-studio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install && pnpm db:generate && pnpm build:prod
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
