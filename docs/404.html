<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Studio AI — Official Creator Platform</title>
    <script>
      (function() {
        var path = window.location.pathname.replace(/^\/tiktok-auto-studio\/?/, "");
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        if (path === "privacy" || path.indexOf("privacy") !== -1) {
          window.location.replace("/tiktok-auto-studio/privacy.html");
          return;
        }
        if (path === "terms" || path.indexOf("terms") !== -1) {
          window.location.replace("/tiktok-auto-studio/terms.html");
          return;
        }

        // Rediriger vers HashRouter pour toutes les autres routes (studio, calendar, simulator...)
        window.location.replace("/tiktok-auto-studio/#/" + path + search + hash);
      })();
    </script>
  </head>
  <body style="background-color: #0F172A; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Auto Studio AI</h2>
      <p style="color: #94A3B8; font-size: 14px;">Chargement de l'espace créateur...</p>
    </div>
  </body>
</html>
